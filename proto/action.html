<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Virginight 夜戦プロトタイプ（アクション案）</title>
<style>
* { box-sizing: border-box; }
body {
  margin:0; padding:16px; background:#14121a; color:#d8d4e0;
  font:14px/1.5 "Segoe UI", system-ui, sans-serif;
}
h1 { font-size:15px; margin:0 0 12px; color:#8c86a0; font-weight:500; letter-spacing:.08em; }
#wrap { display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; }
canvas { background:#0e0d14; display:block; image-rendering:pixelated; width:800px; height:450px; max-width:100%; }
#side { width:310px; }
#bar { display:flex; gap:16px; margin-bottom:8px; font-variant-numeric:tabular-nums; }
#bar b { color:#fff; }
#crew { display:flex; gap:8px; margin-top:10px; }
.ch {
  flex:1; padding:6px 8px; background:#191722; border:2px solid #2e2a3c; font-size:12px;
}
.ch.on { border-color:#e0d060; background:#221f2e; }
.ch.dead { opacity:.35; }
.ch b { display:block; font-size:13px; }
.ch .bar { height:5px; background:#3a2530; margin-top:4px; }
.ch .bar i { display:block; height:100%; background:#c25b5b; }
.ch.on .bar i { background:#e0d060; }
#log {
  height:150px; overflow-y:auto; background:#191722; padding:8px 10px;
  font-size:12px; line-height:1.6; border-left:2px solid #2e2a3c; margin-top:10px;
}
.lg-h { color:#d08a8a; } .lg-w { color:#6f9c6f; } .lg-k { color:#e0d060; } .lg-r { color:#7d7690; }
#keys { font-size:12px; color:#7d7690; margin-top:10px; line-height:1.8; }
#keys kbd { background:#2b2739; padding:1px 6px; border:1px solid #3d3852; }
#result { margin-top:10px; padding:10px; background:#191722; font-size:12px; white-space:pre-wrap; }
button { font:inherit; padding:6px 12px; margin-right:6px; background:#2b2739; color:#d8d4e0; border:1px solid #3d3852; cursor:pointer; }
button:hover { background:#383150; }
</style>
</head>
<body>

<h1>VIRGINIGHT — 夜戦プロトタイプ（アクション案）/ 検証: 交代が「誰を危険にさらすか」の判断になっているか</h1>

<div id="wrap">
  <div>
    <div id="bar">
      <span>経過 <b id="s-time">0:00</b></span>
      <span>被予告 <b id="s-atk">0</b></span>
      <span>有効な交代 <b id="s-swap">0</b></span>
      <span>BOSS <b id="s-boss">300</b></span>
    </div>
    <canvas id="cv" width="640" height="360"></canvas>
    <div id="crew"></div>
    <div style="margin-top:10px">
      <button id="b-reset">最初から</button>
      <button id="b-box">当たり判定表示</button>
    </div>
  </div>

  <div id="side">
    <div id="keys">
      <kbd>← →</kbd> 移動　<kbd>Space</kbd> ジャンプ（長押しで高く）<br>
      <kbd>J</kbd> 攻撃　<kbd>K</kbd> 空中ダッシュ（Blueのみ）<br>
      <kbd>1</kbd> ユニコーン　<kbd>2</kbd> Red　<kbd>3</kbd> Blue
    </div>
    <div id="log"></div>
    <div id="result"></div>
  </div>
</div>

<script>
'use strict';

// =====================================================================
// 定数：シミュレーションは60Hz固定タイムステップ。実時間ではなくtickで管理する
// =====================================================================
const FPS = 60, STEP = 1000 / FPS, MAXCATCH = 5;
const CW = 640, CH = 360, FLOOR = 300, WALL = 24;

const GRAV = 0.42, RUN = 2.4, JUMP = -7.2, MAXFALL = 9;
const COYOTE = 6, JBUF = 7, ABUF = 5;          // 手触りの必須要素
const SWAP_CD = 18, IFRAMES = 42, HITSTUN = 12;
const DASH_V = 6.2, DASH_T = 10;

// =====================================================================
// キャラクター：全員に走る・跳ぶ・基本攻撃を持たせ、
// 「いないと絶対に回避できない」攻撃は作らない
// =====================================================================
const CHARS = [
  { key:'U',    name:'ユニコーン', hp:16, col:'#e8e4f0',
    atk:{ kind:'shot', dmg:4,  cd:20, rec:8,  speed:5.4 } },
  { key:'Red',  name:'Red',        hp:10, col:'#d06a6a',
    atk:{ kind:'melee', dmg:9, cd:26, rec:22, reach:42 } },
  { key:'Blue', name:'Blue',       hp: 8, col:'#6a9ad0',
    atk:{ kind:'shot', dmg:2,  cd:18, rec:6,  speed:4.6 }, dash:true },
];

// =====================================================================
// ボス：固定5パターン・乱数なし。2周目は予告が20%短くなる
// =====================================================================
// rec は攻撃後の隙＝プレイヤーの攻撃機会。ここを長く取ることで
// 「1周8〜12回の予告攻撃」に収めつつ、攻める時間を作る
const PATTERNS = [
  { id:'GROUND WAVE',      tel:70, dmg:3, rec:100 },
  { id:'FALLING COLUMNS',  tel:75, dmg:3, rec: 95 },
  { id:'SLAM',             tel:64, dmg:4, rec:130 },  // 隙が最も長い＝Redの主要な攻撃機会
  { id:'TRACKING BEAM',    tel:80, dmg:4, rec: 95 },
  { id:'PROJECTILE FAN',   tel:72, dmg:3, rec:105 },
];
// ボスは接地させる。浮かせると地上からの近接攻撃が届かない
const BOSS_HP = 220, BOSS_X = 470, BOSS_Y = 206, BW = 56, BH = FLOOR - 206;

let S, hitboxes = false, paused = false, acc = 0, last = 0;

function reset() {
  S = {
    t: 0, over: null,
    p: { x:140, y:FLOOR-28, vx:0, vy:0, face:1, ground:false, coyote:0,
         atkCd:0, rec:0, inv:0, stun:0, swapCd:0, dash:0, dashLeft:1, cur:0 },
    hp: CHARS.map(c => c.hp),
    boss: { hp:BOSS_HP, phase:'idle', tmr:90, pat:0, loop:0, y:BOSS_Y, hurt:0 },
    haz: [], shots: [], marks: [],
    log: [], hitstop: 0,
    // 計測
    atkCount: 0, swaps: 0, swapPend: null, byChar: [0,0,0], swapLog: [],
  };
  say('lg-r', '── 夜戦 開始 ──');
  document.getElementById('result').textContent = '';
}

const say = (c, t) => { S.log.push({c,t}); if (S.log.length > 120) S.log.shift(); };
const CUR = () => CHARS[S.p.cur];
const alive = i => S.hp[i] > 0;

// =====================================================================
// 入力：バッファを持つ。押した瞬間を取りこぼさないため
// =====================================================================
const keys = {}, buf = { jump:-99, atk:-99, dash:-99 };
addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','Space','KeyJ','KeyK','Digit1','Digit2','Digit3'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;
  if (e.code === 'Space') buf.jump = S.t;
  if (e.code === 'KeyJ')  buf.atk  = S.t;
  if (e.code === 'KeyK')  buf.dash = S.t;
  if (e.code === 'Digit1') swap(0);
  if (e.code === 'Digit2') swap(1);
  if (e.code === 'Digit3') swap(2);
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { paused = true; });
addEventListener('focus', () => { paused = false; last = performance.now(); });

// =====================================================================
// 交代：座標と速度を引き継ぐ。無敵も硬直キャンセルも与えない
// =====================================================================
function swap(i, auto) {
  if (S.over || i === S.p.cur || !alive(i)) return;
  const p = S.p;
  if (!auto && (p.swapCd > 0 || p.rec > 0 || p.stun > 0)) return;
  const from = S.p.cur;
  p.cur = i; p.swapCd = SWAP_CD; p.atkCd = 0;
  if (CHARS[i].dash && p.ground) p.dashLeft = 1;

  // 「意味のある交代」の判定：予告中の交代は即座に有効。
  // それ以外は交代後60tick以内に固有行動を使ったかで判定する
  const duringTel = S.boss.phase === 'tel';
  if (duringTel) countSwap(from, i, '予告中');
  else S.swapPend = { from, to:i, t:S.t };
}
function countSwap(from, to, why) {
  S.swaps++;
  S.swapLog.push(`${CHARS[from].name}→${CHARS[to].name}（${why}）`);
}

// =====================================================================
// 更新
// =====================================================================
function step() {
  if (S.over) return;
  if (S.hitstop > 0) { S.hitstop--; return; }   // ヒットストップ中は時間を止める
  S.t++;
  const p = S.p, c = CUR();

  // 保留中の交代が固有行動へ繋がったかを見る
  if (S.swapPend && S.t - S.swapPend.t > 60) S.swapPend = null;

  for (const k of ['atkCd','rec','inv','stun','swapCd']) if (p[k] > 0) p[k]--;

  // --- 移動 ---
  if (p.stun <= 0 && p.dash <= 0) {
    let ax = 0;
    if (keys.ArrowLeft)  ax -= 1;
    if (keys.ArrowRight) ax += 1;
    if (p.rec > 0) ax = 0;                       // 攻撃硬直中は動けない
    if (ax) p.face = ax;
    p.vx = ax * RUN;
  }

  if (p.dash > 0) { p.dash--; if (p.dash === 0) p.vy = 0; }
  else { p.vy = Math.min(p.vy + GRAV, MAXFALL); }

  // ジャンプ：コヨーテタイムと先行入力
  if (p.ground) p.coyote = COYOTE; else if (p.coyote > 0) p.coyote--;
  if (S.t - buf.jump <= JBUF && p.coyote > 0 && p.stun <= 0 && p.rec <= 0 && p.dash <= 0) {
    p.vy = JUMP; p.ground = false; p.coyote = 0; buf.jump = -99;
  }
  if (!keys.Space && p.vy < -2.2) p.vy *= 0.55;  // ボタンを離すと上昇を切る

  // 空中ダッシュ：Blueだけ。無敵ではない
  if (c.dash && S.t - buf.dash <= ABUF && p.dashLeft > 0 && !p.ground && p.stun <= 0 && p.dash <= 0) {
    p.dash = DASH_T; p.dashLeft--; p.vy = 0; p.vx = p.face * DASH_V; buf.dash = -99;
    if (S.swapPend) { countSwap(S.swapPend.from, S.swapPend.to, '固有移動'); S.swapPend = null; }
  }
  if (p.dash > 0) p.vx = p.face * DASH_V;

  p.x += p.vx; p.y += p.vy;
  if (p.x < WALL) { p.x = WALL; p.vx = 0; }
  if (p.x > CW - WALL - 18) { p.x = CW - WALL - 18; p.vx = 0; }
  if (p.y >= FLOOR - 28) { p.y = FLOOR - 28; p.vy = 0; p.ground = true; p.dashLeft = 1; }
  else p.ground = false;

  // --- 攻撃 ---
  if (S.t - buf.atk <= ABUF && p.atkCd <= 0 && p.stun <= 0 && p.rec <= 0 && p.dash <= 0) {
    buf.atk = -99; p.atkCd = c.atk.cd; p.rec = c.atk.rec;
    if (c.atk.kind === 'shot') {
      S.shots.push({ x:p.x+9, y:p.y+13, vx:p.face*c.atk.speed, dmg:c.atk.dmg });
    } else {
      const hx = p.face > 0 ? p.x+18 : p.x-c.atk.reach;
      if (aabb({x:hx,y:p.y,w:c.atk.reach,h:28}, bossBox())) hitBoss(c.atk.dmg, 4);
    }
    if (S.swapPend && S.p.cur !== S.swapPend.from) {
      countSwap(S.swapPend.from, S.swapPend.to, '固有攻撃'); S.swapPend = null;
    }
  }

  // --- 自弾 ---
  for (const s of S.shots) {
    s.x += s.vx;
    if (aabb({x:s.x,y:s.y,w:7,h:4}, bossBox())) { hitBoss(s.dmg, 2); s.dead = true; }
  }
  S.shots = S.shots.filter(s => !s.dead && s.x > 0 && s.x < CW);

  bossStep();
  hazStep();

  if (S.boss.hp <= 0) finish(true);
  if (!alive(0)) finish(false);
}

const bossBox = () => ({ x:BOSS_X, y:S.boss.y, w:BW, h:BH });
const aabb = (a,b) => a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
const pbox = () => ({ x:S.p.x+3, y:S.p.y+3, w:12, h:24 });   // 見た目より小さいhurtbox

function hitBoss(d, stop) {
  S.boss.hp -= d; S.boss.hurt = 6; S.hitstop = stop;
}

// =====================================================================
// ボス：予告 → 攻撃 → 隙 の固定ループ
// =====================================================================
function bossStep() {
  const b = S.boss;
  b.hurt = Math.max(0, b.hurt - 1);
  b.tmr--;
  if (b.tmr > 0) return;

  if (b.phase === 'idle' || b.phase === 'rec') {
    const pat = PATTERNS[b.pat];
    b.phase = 'tel';
    b.tel = Math.round(pat.tel * (b.loop > 0 ? 0.8 : 1));   // 2周目は20%速い
    b.tmr = b.tel;
    b.lockX = null;
    S.marks = telegraph(pat);
    say('', `${pat.id} — 予告 ${b.tel}f`);
  }
  else if (b.phase === 'tel') {
    const pat = PATTERNS[b.pat];
    if (pat.id === 'TRACKING BEAM') b.lockX = S.p.x + 9;    // ここで座標を固定し、以後追尾しない
    fire(pat, b.lockX);
    S.marks = [];
    b.phase = 'rec'; b.tmr = pat.rec;
    b.pat++;
    if (b.pat >= PATTERNS.length) { b.pat = 0; b.loop++; }
  }
}

// 予告表示（危険範囲）
function telegraph(pat) {
  switch (pat.id) {
    case 'GROUND WAVE':     return [{x:WALL, y:FLOOR-20, w:CW-WALL*2, h:20}];
    case 'FALLING COLUMNS': return [120,300,420].map(x => ({x:x-17, y:0, w:34, h:FLOOR}));
    case 'SLAM':            return [{x:BOSS_X-150, y:FLOOR-40, w:BW+300, h:40}];
    case 'TRACKING BEAM':   return [{x:S.p.x-6, y:0, w:30, h:FLOOR, track:true}];
    case 'PROJECTILE FAN':  return [{x:WALL, y:FLOOR-120, w:CW-WALL*2, h:96}];
  }
  return [];
}

function fire(pat, lockX) {
  const d = pat.dmg;
  switch (pat.id) {
    case 'GROUND WAVE':
      S.haz.push({ x:BOSS_X, y:FLOOR-22, w:26, h:22, vx:-3.6, dmg:d, life:200, tag:pat.id });
      break;
    case 'FALLING COLUMNS':
      for (const x of [120,300,420])
        S.haz.push({ x:x-17, y:-90, w:34, h:90, vy:6.5, dmg:d, life:120, tag:pat.id });
      break;
    case 'SLAM':
      S.haz.push({ x:BOSS_X-150, y:FLOOR-40, w:BW+300, h:40, dmg:d, life:16, tag:pat.id });
      break;
    case 'TRACKING BEAM':
      S.haz.push({ x:lockX-15, y:0, w:30, h:FLOOR, dmg:d, life:22, tag:pat.id });
      break;
    case 'PROJECTILE FAN':
      [-2.0,-1.0,1.0,2.0].forEach(vy =>                        // 中央に隙間を空ける
        S.haz.push({ x:BOSS_X, y:FLOOR-110, w:12, h:12, vx:-3.2, vy, dmg:d, life:200, tag:pat.id }));
      break;
  }
  S.atkCount++;
}

function hazStep() {
  const p = S.p;
  for (const h of S.haz) {
    h.x += h.vx || 0; h.y += h.vy || 0; h.life--;
    if (h.y + h.h > FLOOR && h.vy) { h.y = FLOOR - h.h; h.vy = 0; h.life = Math.min(h.life, 14); }
    if (h.hit || p.inv > 0 || S.over) continue;
    if (aabb(pbox(), h)) {
      h.hit = true;
      const i = p.cur;
      S.hp[i] = Math.max(0, S.hp[i] - h.dmg);
      p.inv = IFRAMES; p.stun = HITSTUN; S.hitstop = 4;
      p.vx = 0; p.vy = -2.4;
      S.byChar[i]++;                                    // 「誰が受けたか」を記録
      say('lg-h', `${CHARS[i].name} ← ${h.tag} -${h.dmg}`);
      if (S.hp[i] <= 0) {
        say('lg-k', `${CHARS[i].name} 戦闘不能`);
        if (i === 0) { finish(false); return; }
        const n = [0,1,2].find(alive);
        if (n === undefined) { finish(false); return; }
        swap(n, true);
      }
    }
  }
  S.haz = S.haz.filter(h => h.life > 0 && h.x > -140 && h.x < CW+140);
}

// =====================================================================
// 終了と計測
// =====================================================================
function finish(won) {
  if (S.over) return;
  S.over = won ? 'win' : 'lose';
  say('lg-r', won ? '── 勝利 ──' : '── 敗北 ──');

  const secs = Math.round(S.t / FPS);
  const tot = S.byChar.reduce((a,b)=>a+b, 0);
  const top = tot ? Math.max(...S.byChar) / tot : 0;
  const used = S.byChar.filter(n => n > 0).length;
  const ok = b => b ? '✅' : '❌';
  const fm = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;

  document.getElementById('result').textContent =
    `${won ? '勝利' : '敗北'}\n` +
    `${ok(secs<=180)} 所要時間 ${fm(secs)}   （初見3分以内 / 習熟後2分以内）\n` +
    `${ok(S.atkCount>=8&&S.atkCount<=12)} 予告攻撃 ${S.atkCount} 回   （8〜12）\n` +
    `${ok(S.swaps>=6&&S.swaps<=12)} 有効な交代 ${S.swaps} 回   （6〜12）\n\n` +
    `【偏り】被弾を担当したキャラ\n` +
    CHARS.map((c,i) => `  ${c.name}: ${S.byChar[i]}`).join('\n') +
    `\n  ${ok(tot===0||top<=0.6)} 最多担当 ${Math.round(top*100)}%   （60%以下）\n` +
    `  ${ok(used>=2)} 担当したキャラ ${used} 人\n\n` +
    `【有効な交代の内訳】\n` +
    (S.swapLog.length ? S.swapLog.map(s=>'  '+s).join('\n') : '  なし') +
    `\n\n※「有効な交代」= 予告中の交代、または交代後60tick以内に固有攻撃・固有移動を使ったもの`;
}

// =====================================================================
// 描画
// =====================================================================
const cx = document.getElementById('cv').getContext('2d');

function draw() {
  cx.fillStyle = '#0e0d14'; cx.fillRect(0,0,CW,CH);
  cx.fillStyle = '#1b1926'; cx.fillRect(0,FLOOR,CW,CH-FLOOR);
  cx.fillRect(0,0,WALL,CH); cx.fillRect(CW-WALL,0,WALL,CH);

  // 予告：残りフレームに応じて明滅を強める
  const b = S.boss;
  if (b.phase === 'tel') {
    const near = b.tmr <= 12;
    cx.fillStyle = near ? 'rgba(210,70,70,.42)' : 'rgba(180,60,60,.18)';
    cx.strokeStyle = near ? '#ff8080' : '#a03c3c';
    for (const m of S.marks) {
      const mm = m.track ? {...m, x:S.p.x-6} : m;
      cx.fillRect(mm.x, mm.y, mm.w, mm.h);
      cx.strokeRect(mm.x+.5, mm.y+.5, mm.w-1, mm.h-1);
    }
    cx.fillStyle = '#ff9090'; cx.font = 'bold 13px system-ui';
    cx.fillText(`${PATTERNS[b.pat].id}  ${b.tmr}f  -${PATTERNS[b.pat].dmg}`, WALL+6, 22);
  }

  for (const h of S.haz) { cx.fillStyle = '#c04848'; cx.fillRect(h.x,h.y,h.w,h.h); }
  for (const s of S.shots) { cx.fillStyle = '#e0d060'; cx.fillRect(s.x,s.y,7,4); }

  // ボス
  cx.fillStyle = b.hurt ? '#fff' : (b.phase==='rec' ? '#5c4a6e' : '#3f3552');
  cx.fillRect(BOSS_X, b.y, BW, BH);
  if (b.phase === 'rec') { cx.fillStyle='#8c86a0'; cx.font='11px system-ui'; cx.fillText('隙', BOSS_X+20, b.y-6); }
  cx.fillStyle = '#2a2436'; cx.fillRect(BOSS_X-4, b.y-16, BW+8, 7);
  cx.fillStyle = '#c25b5b'; cx.fillRect(BOSS_X-4, b.y-16, (BW+8)*Math.max(0,b.hp)/BOSS_HP, 7);

  // プレイヤー
  const p = S.p, c = CUR();
  if (!(p.inv > 0 && Math.floor(S.t/4) % 2)) {
    cx.fillStyle = c.col; cx.fillRect(p.x, p.y, 18, 28);
    cx.fillStyle = '#0e0d14'; cx.fillRect(p.x + (p.face>0?12:3), p.y+7, 3, 3);
  }
  if (p.rec > 0 && c.atk.kind === 'melee') {
    cx.fillStyle = 'rgba(224,208,96,.5)';
    cx.fillRect(p.face>0 ? p.x+18 : p.x-c.atk.reach, p.y, c.atk.reach, 28);
  }

  if (hitboxes) {
    cx.strokeStyle = '#0f0'; const q = pbox(); cx.strokeRect(q.x,q.y,q.w,q.h);
    cx.strokeStyle = '#f00'; for (const h of S.haz) cx.strokeRect(h.x,h.y,h.w,h.h);
  }
  if (paused) { cx.fillStyle='rgba(0,0,0,.6)'; cx.fillRect(0,0,CW,CH);
    cx.fillStyle='#d8d4e0'; cx.font='16px system-ui'; cx.fillText('PAUSED — クリックで再開', 230, 180); }
}

function hud() {
  const fm = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  document.getElementById('s-time').textContent = fm(Math.round(S.t/FPS));
  document.getElementById('s-atk').textContent  = S.atkCount;
  document.getElementById('s-swap').textContent = S.swaps;
  document.getElementById('s-boss').textContent = Math.max(0, S.boss.hp);
  document.getElementById('crew').innerHTML = CHARS.map((c,i) =>
    `<div class="ch ${i===S.p.cur?'on':''} ${alive(i)?'':'dead'}">
       <b>${i+1} ${c.name}</b>${S.hp[i]}/${c.hp}
       <span class="bar"><i style="width:${100*S.hp[i]/c.hp}%"></i></span>
     </div>`).join('');
  const lg = document.getElementById('log');
  lg.innerHTML = S.log.map(l => `<div class="${l.c}">${l.t}</div>`).join('');
  lg.scrollTop = lg.scrollHeight;
}

// =====================================================================
// ループ：描画はrAF、シミュレーションは固定60Hz
// =====================================================================
function loop(now) {
  requestAnimationFrame(loop);
  if (!last) last = now;
  acc += now - last; last = now;
  if (acc > STEP * MAXCATCH) acc = STEP * MAXCATCH;   // 復帰時の暴走を防ぐ
  if (!paused) while (acc >= STEP) { step(); acc -= STEP; }
  draw(); hud();
}

document.getElementById('b-reset').onclick = () => { reset(); last = 0; acc = 0; };
document.getElementById('b-box').onclick   = () => { hitboxes = !hitboxes; };
document.getElementById('cv').onclick      = () => { paused = false; last = performance.now(); };

reset();
requestAnimationFrame(loop);
</script>
</body>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Virginight 夜戦プロトタイプ（アクション案）</title>
<style>
* { box-sizing:border-box; }
body { margin:0; padding:16px; background:#14121a; color:#d8d4e0; font:14px/1.5 "Segoe UI", system-ui, sans-serif; }
h1 { font-size:15px; margin:0 0 4px; color:#8c86a0; font-weight:500; letter-spacing:.08em; }
h2 { font-size:12px; margin:0 0 12px; color:#5f596e; font-weight:400; }
#wrap { display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; }
canvas { background:#0e0d14; display:block; image-rendering:pixelated; width:800px; height:450px; max-width:100%; }
#side { width:310px; }
#bar { display:flex; gap:14px; margin-bottom:8px; font-variant-numeric:tabular-nums; }
#bar b { color:#fff; }
#crew { display:flex; gap:8px; margin-top:10px; }
.ch { flex:1; padding:6px 8px; background:#191722; border:2px solid #2e2a3c; font-size:12px; }
.ch.on { border-color:#e0d060; background:#221f2e; }
.ch.down { border-color:#c9a0e0; }
.ch.dead { opacity:.3; }
.ch.dead b { text-decoration:line-through; }
.ch b { display:block; font-size:13px; }
.ch .bar { height:5px; background:#3a2530; margin-top:4px; }
.ch .bar i { display:block; height:100%; background:#c25b5b; }
.ch.on .bar i { background:#e0d060; }
#log { height:150px; overflow-y:auto; background:#191722; padding:8px 10px; font-size:12px;
       line-height:1.6; border-left:2px solid #2e2a3c; margin-top:10px; }
.lg-h { color:#d08a8a; } .lg-w { color:#6f9c6f; } .lg-k { color:#e0d060; }
.lg-r { color:#7d7690; } .lg-d { color:#c9a0e0; }
#keys { font-size:12px; color:#7d7690; line-height:1.8; }
#keys kbd { background:#2b2739; padding:1px 6px; border:1px solid #3d3852; }
#result { margin-top:10px; padding:10px; background:#191722; font-size:12px; white-space:pre-wrap; }
button { font:inherit; padding:6px 12px; margin-right:6px; background:#2b2739; color:#d8d4e0;
         border:1px solid #3d3852; cursor:pointer; }
button:hover { background:#383150; }
</style>
</head>
<body>

<h1>VIRGINIGHT — 夜戦プロトタイプ（アクション案）</h1>
<h2>3戦のミニラン / HPは持ち越し / 倒れた仲間はユニコーンで救出しなければ永久に失われる</h2>

<div id="wrap">
  <div>
    <div id="bar">
      <span>戦闘 <b id="s-bt">1</b> / 3</span>
      <span>経過 <b id="s-time">0:00</b></span>
      <span>被予告 <b id="s-atk">0</b></span>
      <span>有効な交代 <b id="s-swap">0</b></span>
      <span>BOSS <b id="s-boss">0</b></span>
    </div>
    <canvas id="cv" width="640" height="360"></canvas>
    <div id="crew"></div>
    <div style="margin-top:10px">
      <button id="b-retry">この戦闘をやり直す</button>
      <button id="b-reset">最初から</button>
      <button id="b-box">当たり判定表示</button>
    </div>
  </div>
  <div id="side">
    <div id="keys">
      <kbd>← →</kbd> 移動　<kbd>Space</kbd> ジャンプ（長押しで高く）<br>
      <kbd>J</kbd> 攻撃　<kbd>K</kbd> 空中ダッシュ（Blueのみ）<br>
      <kbd>1</kbd> ユニコーン　<kbd>2</kbd> Red　<kbd>3</kbd> Blue<br>
      倒れた仲間の上に<b>ユニコーンで</b>立ち続けると救出できます
    </div>
    <div id="log"></div>
    <div id="result"></div>
  </div>
</div>

<script>
'use strict';

const FPS=60, STEP=1000/FPS, MAXCATCH=5;
const CW=640, CH=360, FLOOR=300, WALL=24;
const GRAV=.42, RUN=2.4, JUMP=-7.2, MAXFALL=9;
const COYOTE=6, JBUF=7, ABUF=5, SWAP_CD=18, IFRAMES=42, HITSTUN=12;
const DASH_V=6.2, DASH_T=10;
const RESCUE_T=40;                       // 救出に必要な接触フレーム

const CHARS = [
  { key:'U',   name:'ユニコーン', hp:16, col:'#e8e4f0', atk:{kind:'shot',  dmg:4, cd:20, rec:8,  speed:5.4} },
  { key:'Red', name:'Red',        hp:10, col:'#d06a6a', atk:{kind:'melee', dmg:9, cd:26, rec:22, reach:42} },
  { key:'Blue',name:'Blue',       hp: 8, col:'#6a9ad0', atk:{kind:'shot',  dmg:2, cd:18, rec:6,  speed:4.6}, dash:true },
];

const BASE = [
  { id:'GROUND WAVE',     tel:70, dmg:3, rec:100 },
  { id:'FALLING COLUMNS', tel:75, dmg:3, rec: 95 },
  { id:'SLAM',            tel:64, dmg:4, rec:130 },
  { id:'TRACKING BEAM',   tel:80, dmg:4, rec: 95 },
  { id:'PROJECTILE FAN',  tel:72, dmg:3, rec:105 },
];
// 第二夜で追加する唯一の新ルール。壁へ誘導できれば大きな隙とアーマーブレイクになる
const CHARGE = { id:'ARMORED CHARGE', tel:90, dmg:5, rec:70, charge:true };

const BATTLES = [
  { name:'第一夜', hp:160, pats:BASE },
  { name:'第二夜', hp:190, pats:BASE.slice(0,3).concat([CHARGE], BASE.slice(3)) },
  { name:'第三夜', hp:210, pats:BASE.slice(0,2).concat([CHARGE], BASE.slice(2)) },
];

const HOME_X = 470, BOSS_Y = 206, BW = 56, BH = FLOOR - BOSS_Y;

let R, S, hitboxes=false, paused=false, acc=0, last=0;

// =====================================================================
// ミニラン
// =====================================================================
function newRun() {
  R = { bt:0, hp:CHARS.map(c=>c.hp), dead:CHARS.map(()=>false), t0:Date.now(), over:null,
        atkCount:0, swaps:0, swapLog:[], role:[0,0,0], hitBy:[0,0,0],
        rescues:0, losses:[], startHp:[], dmgBy:[0,0,0] };
  document.getElementById('result').textContent='';
  startBattle();
}

function startBattle() {
  R.startHp.push(R.hp.slice());
  const B = BATTLES[R.bt];
  const first = [0,1,2].find(i=>!R.dead[i]);
  S = {
    t:0, done:false,
    p:{ x:140, y:FLOOR-28, vx:0, vy:0, face:1, ground:false, coyote:0,
        atkCd:0, rec:0, inv:0, stun:0, swapCd:0, dash:0, dashLeft:1, cur:first },
    boss:{ hp:B.hp, max:B.hp, x:HOME_X, phase:'idle', tmr:100, pat:0, loop:0,
           hurt:0, broken:0, cvx:0 },
    haz:[], shots:[], marks:[], bodies:[], log:[], hitstop:0,
    telSwap:false, swapPend:null, opening:[0,0,0],
  };
  say('lg-r', `── ${B.name}（戦闘 ${R.bt+1}/3） ──`);
}

const say=(c,t)=>{ S.log.push({c,t}); if(S.log.length>120) S.log.shift(); };
const CUR = () => CHARS[S.p.cur];
const usable = i => !R.dead[i] && R.hp[i] > 0;
const PATS = () => BATTLES[R.bt].pats;

// =====================================================================
// 入力
// =====================================================================
const keys={}, buf={jump:-99, atk:-99, dash:-99};
addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','Space','KeyJ','KeyK','Digit1','Digit2','Digit3'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys[e.code]=true;
  if (e.code==='Space') buf.jump=S.t;
  if (e.code==='KeyJ')  buf.atk=S.t;
  if (e.code==='KeyK')  buf.dash=S.t;
  if (e.code==='Digit1') swap(0);
  if (e.code==='Digit2') swap(1);
  if (e.code==='Digit3') swap(2);
});
addEventListener('keyup', e => { keys[e.code]=false; });
addEventListener('blur', ()=>{ paused=true; });
addEventListener('focus', ()=>{ paused=false; last=performance.now(); });

// =====================================================================
// 交代。「意味のある交代」は結果が伴ったものだけを数える
// =====================================================================
function swap(i, auto) {
  if (R.over || S.done || i===S.p.cur || !usable(i)) return;
  const p=S.p;
  if (!auto && (p.swapCd>0 || p.rec>0 || p.stun>0)) return;
  const from=p.cur;
  p.cur=i; p.swapCd=SWAP_CD; p.atkCd=0;
  if (CHARS[i].dash && p.ground) p.dashLeft=1;
  if (auto) return;
  // 予告中の交代は「結果が出たとき」に初めて有効と数える（1予告につき1回まで）
  if (S.boss.phase==='tel' && !S.telSwap) S.telSwap = { from, to:i };
  else S.swapPend = { from, to:i, t:S.t };
}
function credit(from,to,why){ R.swaps++; R.swapLog.push(`戦闘${R.bt+1} ${CHARS[from].name}→${CHARS[to].name}（${why}）`); }

// =====================================================================
// 更新
// =====================================================================
function step() {
  if (R.over || S.done) return;
  if (S.hitstop>0) { S.hitstop--; return; }
  S.t++;
  const p=S.p, c=CUR();

  if (S.swapPend && S.t-S.swapPend.t>60) S.swapPend=null;
  for (const k of ['atkCd','rec','inv','stun','swapCd']) if (p[k]>0) p[k]--;

  if (p.stun<=0 && p.dash<=0) {
    let ax=0;
    if (keys.ArrowLeft) ax-=1;
    if (keys.ArrowRight) ax+=1;
    if (p.rec>0) ax=0;
    if (ax) p.face=ax;
    p.vx = ax*RUN;
  }
  if (p.dash>0) { p.dash--; if (!p.dash) p.vy=0; } else p.vy = Math.min(p.vy+GRAV, MAXFALL);

  if (p.ground) p.coyote=COYOTE; else if (p.coyote>0) p.coyote--;
  if (S.t-buf.jump<=JBUF && p.coyote>0 && p.stun<=0 && p.rec<=0 && p.dash<=0) {
    p.vy=JUMP; p.ground=false; p.coyote=0; buf.jump=-99;
  }
  if (!keys.Space && p.vy<-2.2) p.vy*=.55;

  if (c.dash && S.t-buf.dash<=ABUF && p.dashLeft>0 && !p.ground && p.stun<=0 && p.dash<=0) {
    p.dash=DASH_T; p.dashLeft--; p.vy=0; p.vx=p.face*DASH_V; buf.dash=-99;
    if (S.swapPend) { credit(S.swapPend.from,S.swapPend.to,'固有移動'); S.swapPend=null; }
  }
  if (p.dash>0) p.vx = p.face*DASH_V;

  p.x+=p.vx; p.y+=p.vy;
  if (p.x<WALL){p.x=WALL;p.vx=0;}
  if (p.x>CW-WALL-18){p.x=CW-WALL-18;p.vx=0;}
  if (p.y>=FLOOR-28){p.y=FLOOR-28;p.vy=0;p.ground=true;p.dashLeft=1;} else p.ground=false;

  // 攻撃
  if (S.t-buf.atk<=ABUF && p.atkCd<=0 && p.stun<=0 && p.rec<=0 && p.dash<=0) {
    buf.atk=-99; p.atkCd=c.atk.cd; p.rec=c.atk.rec;
    if (c.atk.kind==='shot') S.shots.push({x:p.x+9,y:p.y+13,vx:p.face*c.atk.speed,dmg:c.atk.dmg});
    else {
      const hx = p.face>0 ? p.x+18 : p.x-c.atk.reach;
      if (aabb({x:hx,y:p.y,w:c.atk.reach,h:28}, bossBox())) hitBoss(c.atk.dmg,4);
    }
    if (S.swapPend) { credit(S.swapPend.from,S.swapPend.to,'固有攻撃'); S.swapPend=null; }
  }

  for (const s of S.shots) { s.x+=s.vx; if (aabb({x:s.x,y:s.y,w:7,h:4}, bossBox())) { hitBoss(s.dmg,2); s.dead=true; } }
  S.shots = S.shots.filter(s=>!s.dead && s.x>0 && s.x<CW);

  bossStep(); hazStep(); rescueStep();

  if (S.boss.hp<=0) winBattle();
  if (!usable(0) && !S.bodies.some(b=>b.ci===0)) endRun(false);
}

const bossBox = () => ({x:S.boss.x, y:BOSS_Y, w:BW, h:BH});
const aabb=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const pbox=()=>({x:S.p.x+3,y:S.p.y+3,w:12,h:24});

function hitBoss(d, stop) {
  const b=S.boss;
  const mul = b.broken>0 ? 1.5 : 1;            // アーマーブレイク中は与ダメージ増加
  b.hp -= d*mul; b.hurt=6; S.hitstop=stop;
  R.dmgBy[S.p.cur] += d*mul;
  if (b.phase==='rec' || b.broken>0) S.opening[S.p.cur] += d*mul;
}

// =====================================================================
// ボス
// =====================================================================
function bossStep() {
  const b=S.boss;
  b.hurt=Math.max(0,b.hurt-1);
  if (b.broken>0) b.broken--;

  if (b.phase==='charge') {                    // 突進中：接触で被弾。壁に激突すると大きな隙
    b.x += b.cvx;
    if (aabb(pbox(), bossBox())) damage(PATS()[b.pat].dmg, 'ARMORED CHARGE');
    if (b.x <= WALL) { b.x=WALL; b.phase='rec'; b.tmr=170; b.broken=170;
                       say('lg-w','ボスが壁に激突した — アーマーブレイク'); nextPat(); return; }
    if (b.x <= b.goal) { b.phase='rec'; b.tmr=PATS()[b.pat].rec; nextPat(); }
    return;
  }
  if (b.phase==='back') { b.x = Math.min(HOME_X, b.x+1.6); if (b.x>=HOME_X) { b.phase='idle'; b.tmr=40; } return; }

  b.tmr--;
  if (b.tmr>0) return;

  if (b.phase==='idle' || b.phase==='rec') {
    if (b.x < HOME_X-2) { b.phase='back'; return; }
    const pat=PATS()[b.pat];
    b.phase='tel'; b.tel=Math.round(pat.tel*(b.loop>0?.8:1)); b.tmr=b.tel; b.lockX=null;
    S.marks=telegraph(pat);
    say('', `${pat.id} — 予告 ${b.tel}f`);
  }
  else if (b.phase==='tel') {
    const pat=PATS()[b.pat];
    if (pat.id==='TRACKING BEAM') b.lockX=S.p.x+9;
    if (pat.charge) {                          // 突進はプレイヤーのx座標へ向かう
      b.goal = Math.max(WALL, S.p.x+9-BW/2);
      b.cvx = -5.2; b.phase='charge'; S.marks=[]; R.atkCount++;
      say('', 'ARMORED CHARGE 発動');
      return;
    }
    fire(pat, b.lockX);
    S.marks=[]; b.phase='rec'; b.tmr=pat.rec; nextPat();
  }
}
function nextPat(){ const b=S.boss; b.pat++; if (b.pat>=PATS().length){b.pat=0;b.loop++;} }

function telegraph(pat) {
  const bx=S.boss.x;
  switch (pat.id) {
    case 'GROUND WAVE':     return [{x:WALL,y:FLOOR-20,w:CW-WALL*2,h:20}];
    case 'FALLING COLUMNS': return [120,300,420].map(x=>({x:x-17,y:0,w:34,h:FLOOR}));
    case 'SLAM':            return [{x:bx-150,y:FLOOR-40,w:BW+300,h:40}];
    case 'TRACKING BEAM':   return [{x:S.p.x-6,y:0,w:30,h:FLOOR,track:true}];
    case 'PROJECTILE FAN':  return [{x:WALL,y:FLOOR-120,w:CW-WALL*2,h:96}];
    case 'ARMORED CHARGE':  return [{x:WALL,y:FLOOR-70,w:bx-WALL,h:70,charge:true}];
  }
  return [];
}

function fire(pat, lockX) {
  const d=pat.dmg, bx=S.boss.x;
  switch (pat.id) {
    case 'GROUND WAVE':
      S.haz.push({x:bx,y:FLOOR-22,w:26,h:22,vx:-3.6,dmg:d,life:200,tag:pat.id}); break;
    case 'FALLING COLUMNS':
      for (const x of [120,300,420]) S.haz.push({x:x-17,y:-90,w:34,h:90,vy:6.5,dmg:d,life:120,tag:pat.id}); break;
    case 'SLAM':
      S.haz.push({x:bx-150,y:FLOOR-40,w:BW+300,h:40,dmg:d,life:16,tag:pat.id}); break;
    case 'TRACKING BEAM':
      S.haz.push({x:lockX-15,y:0,w:30,h:FLOOR,dmg:d,life:22,tag:pat.id}); break;
    case 'PROJECTILE FAN':
      [-2,-1,1,2].forEach(vy=>S.haz.push({x:bx,y:FLOOR-110,w:12,h:12,vx:-3.2,vy,dmg:d,life:200,tag:pat.id})); break;
  }
  R.atkCount++;
  resolveTelSwap();
}

// 予告が解決した時点で「担当」を記録し、予告中の交代を有効と数える
function resolveTelSwap() {
  const i=S.p.cur;
  R.role[i]++;
  if (S.telSwap) { credit(S.telSwap.from, S.telSwap.to, '予告に対応'); S.telSwap=null; }
}

function hazStep() {
  for (const h of S.haz) {
    h.x+=h.vx||0; h.y+=h.vy||0; h.life--;
    if (h.y+h.h>FLOOR && h.vy) { h.y=FLOOR-h.h; h.vy=0; h.life=Math.min(h.life,14); }
    if (h.hit || S.p.inv>0 || R.over || S.done) continue;
    if (aabb(pbox(),h)) { h.hit=true; damage(h.dmg, h.tag); }
  }
  S.haz = S.haz.filter(h=>h.life>0 && h.x>-140 && h.x<CW+140);
}

function damage(dmg, tag) {
  const p=S.p, i=p.cur;
  R.hp[i]=Math.max(0, R.hp[i]-dmg);
  p.inv=IFRAMES; p.stun=HITSTUN; S.hitstop=4; p.vx=0; p.vy=-2.4;
  R.hitBy[i]++;
  say('lg-h', `${CHARS[i].name} ← ${tag} -${dmg}`);
  if (R.hp[i]<=0) down(i);
}

// HP0 は即死亡ではなく Downed。身体がその場に残る
function down(i) {
  if (i===0) { say('lg-k','ユニコーンが倒れた'); endRun(false); return; }
  S.bodies.push({ ci:i, x:S.p.x, y:FLOOR-20, prog:0, dl:R.atkCount+1 });
  say('lg-d', `${CHARS[i].name} が倒れた — 次の予告攻撃までにユニコーンで救出しないと永久に失う`);
  const n=[0,1,2].find(usable);
  if (n===undefined) { endRun(false); return; }
  swap(n, true);
}

function rescueStep() {
  for (const b of S.bodies) {
    if (R.atkCount >= b.dl) {                  // 期限切れ＝永久死亡
      R.dead[b.ci]=true; b.gone=true;
      R.losses.push(`${CHARS[b.ci].name}（戦闘${R.bt+1}）`);
      say('lg-k', `${CHARS[b.ci].name} を救えなかった。永久に失った`);
      continue;
    }
    // 救出できるのはユニコーンだけ。留まる時間を支払う
    if (S.p.cur===0 && aabb(pbox(), {x:b.x,y:b.y,w:20,h:20})) {
      b.prog++;
      if (b.prog>=RESCUE_T) {
        b.gone=true; R.hp[b.ci]=1; R.rescues++;
        say('lg-w', `${CHARS[b.ci].name} を救出した（HP1）`);
      }
    } else if (b.prog>0) b.prog--;
  }
  S.bodies = S.bodies.filter(b=>!b.gone);
}

// =====================================================================
// 戦闘の決着
// =====================================================================
function winBattle() {
  if (S.done) return;
  S.done=true;
  for (const b of S.bodies) { R.hp[b.ci]=Math.max(1,R.hp[b.ci]); R.rescues++;
    say('lg-w', `${CHARS[b.ci].name} を回収した`); }
  S.bodies=[];
  say('lg-r', `── ${BATTLES[R.bt].name} を凌いだ ──`);
  R.bt++;
  if (R.bt>=BATTLES.length) { endRun(true); return; }
  setTimeout(()=>{ if(!R.over) startBattle(); }, 1000);
}

function endRun(won) {
  if (R.over) return;
  R.over = won?'win':'lose'; S.done=true;
  say('lg-r', won?'── 4つ目の夜明け ──':'── ユニコーンが倒れた ──');

  const secs=Math.round((Date.now()-R.t0)/1000);
  const ok=b=>b?'✅':'❌';
  const fm=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  const roles=[0,1,2].filter(i=>R.role[i]>=2 || R.dmgBy[i]>=40).length;

  document.getElementById('result').textContent =
    `${won?'踏破':'敗北'}（戦闘 ${Math.min(R.bt+1,3)}/3）\n` +
    `${ok(secs<=420)} 所要時間 ${fm(secs)}   （3戦合計 5〜7分）\n` +
    `${ok(R.atkCount>=24&&R.atkCount<=40)} 予告攻撃 ${R.atkCount} 回   （24〜40）\n` +
    `${ok(R.swaps>=18&&R.swaps<=40)} 有効な交代 ${R.swaps} 回   （18〜40）\n\n` +
    `【1】3人とも役割を持ったか\n` +
    CHARS.map((c,i)=>`  ${c.name}: 予告対応 ${R.role[i]} 回 / 与ダメージ ${Math.round(R.dmgBy[i])}`).join('\n') +
    `\n  ${ok(roles>=3)} 役割を持ったキャラ ${roles} 人   （3人）\n` +
    `  ※ 予告対応2回以上、または与ダメージ40以上で「役割あり」。無被弾でも不合格にならない\n\n` +
    `【2】損失が次の戦闘を変えたか\n` +
    `  救出 ${R.rescues} 回 / 永久に失った仲間 ${R.losses.length} 人\n` +
    (R.losses.length ? R.losses.map(s=>'  ・'+s).join('\n')+'\n' : '') +
    `  戦闘開始時のHP:\n` +
    R.startHp.map((h,i)=>`    戦闘${i+1}: `+CHARS.map((c,j)=>`${c.name} ${h[j]}`).join(' / ')).join('\n') +
    `\n\n【有効な交代の内訳】\n` +
    (R.swapLog.length ? R.swapLog.slice(-14).map(s=>'  '+s).join('\n') : '  なし');
}

// =====================================================================
// 描画
// =====================================================================
const cx = document.getElementById('cv').getContext('2d');

function draw() {
  cx.fillStyle='#0e0d14'; cx.fillRect(0,0,CW,CH);
  cx.fillStyle='#1b1926'; cx.fillRect(0,FLOOR,CW,CH-FLOOR);
  cx.fillRect(0,0,WALL,CH); cx.fillRect(CW-WALL,0,WALL,CH);
  const b=S.boss;

  if (b.phase==='tel') {
    const near=b.tmr<=12;
    cx.fillStyle=near?'rgba(210,70,70,.42)':'rgba(180,60,60,.18)';
    cx.strokeStyle=near?'#ff8080':'#a03c3c';
    for (const m of S.marks) {
      const mm = m.track ? {...m, x:S.p.x-6} : m;
      cx.fillRect(mm.x,mm.y,mm.w,mm.h); cx.strokeRect(mm.x+.5,mm.y+.5,mm.w-1,mm.h-1);
    }
    const pat=PATS()[b.pat];
    cx.fillStyle='#ff9090'; cx.font='bold 13px system-ui';
    cx.fillText(`${pat.id}  ${b.tmr}f  -${pat.dmg}`, WALL+6, 22);
    if (pat.charge) { cx.fillStyle='#c9a0e0'; cx.font='11px system-ui';
      cx.fillText('壁まで誘導すればアーマーブレイク', WALL+6, 38); }
  }

  for (const h of S.haz) { cx.fillStyle='#c04848'; cx.fillRect(h.x,h.y,h.w,h.h); }
  for (const s of S.shots) { cx.fillStyle='#e0d060'; cx.fillRect(s.x,s.y,7,4); }

  // 倒れた仲間
  for (const bd of S.bodies) {
    cx.fillStyle='#c9a0e0'; cx.fillRect(bd.x,bd.y,20,20);
    cx.fillStyle='#2a2436'; cx.fillRect(bd.x,bd.y-7,20,4);
    cx.fillStyle='#e0d060'; cx.fillRect(bd.x,bd.y-7,20*bd.prog/RESCUE_T,4);
    cx.fillStyle='#c9a0e0'; cx.font='10px system-ui';
    cx.fillText(CHARS[bd.ci].name, bd.x-6, bd.y-11);
  }

  cx.fillStyle = b.hurt?'#fff':(b.broken>0?'#7a5c8e':(b.phase==='rec'?'#5c4a6e':'#3f3552'));
  cx.fillRect(b.x,BOSS_Y,BW,BH);
  if (b.broken>0) { cx.fillStyle='#c9a0e0'; cx.font='bold 11px system-ui'; cx.fillText('BREAK', b.x+8, BOSS_Y-22); }
  else if (b.phase==='rec') { cx.fillStyle='#8c86a0'; cx.font='11px system-ui'; cx.fillText('隙', b.x+22, BOSS_Y-22); }
  cx.fillStyle='#2a2436'; cx.fillRect(b.x-4,BOSS_Y-16,BW+8,7);
  cx.fillStyle='#c25b5b'; cx.fillRect(b.x-4,BOSS_Y-16,(BW+8)*Math.max(0,b.hp)/b.max,7);

  const p=S.p, c=CUR();
  if (!(p.inv>0 && Math.floor(S.t/4)%2)) {
    cx.fillStyle=c.col; cx.fillRect(p.x,p.y,18,28);
    cx.fillStyle='#0e0d14'; cx.fillRect(p.x+(p.face>0?12:3),p.y+7,3,3);
  }
  if (p.rec>0 && c.atk.kind==='melee') {
    cx.fillStyle='rgba(224,208,96,.5)';
    cx.fillRect(p.face>0?p.x+18:p.x-c.atk.reach, p.y, c.atk.reach, 28);
  }
  if (hitboxes) {
    cx.strokeStyle='#0f0'; const q=pbox(); cx.strokeRect(q.x,q.y,q.w,q.h);
    cx.strokeStyle='#f00'; for (const h of S.haz) cx.strokeRect(h.x,h.y,h.w,h.h);
  }
  if (paused) { cx.fillStyle='rgba(0,0,0,.6)'; cx.fillRect(0,0,CW,CH);
    cx.fillStyle='#d8d4e0'; cx.font='16px system-ui'; cx.fillText('PAUSED — クリックで再開',230,180); }
}

function hud() {
  const q=id=>document.getElementById(id);
  const fm=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  q('s-bt').textContent = Math.min(R.bt+1,3);
  q('s-time').textContent = fm(Math.round((Date.now()-R.t0)/1000));
  q('s-atk').textContent = R.atkCount;
  q('s-swap').textContent = R.swaps;
  q('s-boss').textContent = Math.max(0, Math.round(S.boss.hp));
  q('crew').innerHTML = CHARS.map((c,i)=>{
    const dn = S.bodies.some(b=>b.ci===i);
    return `<div class="ch ${i===S.p.cur?'on':''} ${R.dead[i]?'dead':''} ${dn?'down':''}">
      <b>${i+1} ${c.name}</b>${R.dead[i]?'失った':(dn?'DOWN':`${R.hp[i]}/${c.hp}`)}
      <span class="bar"><i style="width:${100*Math.max(0,R.hp[i])/c.hp}%"></i></span></div>`;
  }).join('');
  const lg=q('log');
  lg.innerHTML = S.log.map(l=>`<div class="${l.c}">${l.t}</div>`).join('');
  lg.scrollTop = lg.scrollHeight;
}

function loop(now) {
  requestAnimationFrame(loop);
  if (!last) last=now;
  acc += now-last; last=now;
  if (acc > STEP*MAXCATCH) acc = STEP*MAXCATCH;
  if (!paused) while (acc>=STEP) { step(); acc-=STEP; }
  draw(); hud();
}

document.getElementById('b-reset').onclick = () => { newRun(); last=0; acc=0; };
document.getElementById('b-box').onclick   = () => { hitboxes=!hitboxes; };
document.getElementById('cv').onclick      = () => { paused=false; last=performance.now(); };
document.getElementById('b-retry').onclick = () => {
  R.over=null;                                  // 失った仲間は戻らない
  R.hp = R.startHp[R.startHp.length-1].slice();
  R.startHp.pop();
  [0,1,2].forEach(i=>{ if (R.dead[i]) R.hp[i]=0; });
  document.getElementById('result').textContent='';
  startBattle(); last=0; acc=0;
};

newRun();
requestAnimationFrame(loop);
</script>
